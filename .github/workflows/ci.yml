name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -q -r requirements.txt ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: XSS/CSP linter
        run: python scripts/check_xss.py
      - name: Migrations smoke
        run: PYTHONPATH=src python -m pytest tests/test_migrations.py -q
      - name: Tests
        run: PYTHONPATH=src python -m pytest tests/ -q
      # E4: smoke панели в jsdom против локально поднятого сервера (node + jsdom)
      - name: GUI smoke (jsdom)
        run: bash scripts/ci_gui_smoke.sh
