id: nostr
name: Nostr
api_version: NIP-01
module_version: 1.0.0
core_min: 8.6.0
auth:
  method: private_key
  strategy: secp256k1_schnorr_bip340
  env: NOSTR_PRIVATE_KEY
provider_type: protocol
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: false
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: false
  image: false
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: true
  list_scheduled: false
  list_private: true
  scan_mode: auto
  schedule_owner: orchestrator
  content_kinds:
  - text
  - note
  - deletion
  content_kind_default: text
limits:
  source: relay_defined
media:
  text:
    source: inline
statuses:
  published:
  - published
  pending: []
  failed:
  - failed
  - deleted
docs: MODULE_NOSTR.txt
messaging:
  supported: false
webhooks:
  supported: false
access_state: CODE_READY
publish_mode: direct
status_authority: best_effort
media_transfer: pull_from_url
review_requirement: none
account_types:
- keypair
sdk_min: 1.0.0
sdk_policy: backward_compatible
contract_strict: true
