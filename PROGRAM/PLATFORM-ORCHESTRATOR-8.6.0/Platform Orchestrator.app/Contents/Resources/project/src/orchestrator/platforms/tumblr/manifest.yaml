id: tumblr
name: Tumblr
api_version: v2-oauth1a
module_version: 0.2.0
core_min: 8.6.0
auth:
  method: oauth1a
  strategy: social
provider_type: social
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: true
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: false
  image: false
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: false
  list_scheduled: false
  list_private: false
  scan_mode: unsupported
  schedule_owner: orchestrator
  content_kinds: [text]
  content_kind_default: text
limits:
  source: official
  source_url: https://www.tumblr.com/docs/api
media:
  source: not_required_for_text
statuses:
  published: [published]
  pending: []
docs: MODULE_TUMBLR.txt
messaging:
  supported: false
webhooks:
  supported: false
access_state: CODE_READY
publish_mode: direct
status_authority: authoritative
media_transfer: mixed
review_requirement: none
account_types: [blog]
contract_strict: true
