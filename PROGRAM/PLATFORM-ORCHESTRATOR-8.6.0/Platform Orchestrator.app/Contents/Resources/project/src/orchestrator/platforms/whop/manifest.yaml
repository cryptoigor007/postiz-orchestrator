id: whop
name: Whop
api_version: v5
module_version: 1.0.0
core_min: 8.6.0
auth:
  method: bearer_api_key
  strategy: whop_app_api
  env: WHOP_API_KEY
provider_type: community
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: false
  delete: false
  thumbnail: false
  claims_check: unsupported
  video: true
  image: true
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: false
  list_scheduled: false
  list_private: false
  scan_mode: unsupported
  schedule_owner: orchestrator
  content_kinds:
  - text
  - image
  - video
  content_kind_default: text
limits:
  source: official
  source_url: https://dev.whop.com/api-reference/v5/apps/feed-content-items/create
media:
  source: remote_file_url
statuses:
  published:
  - published
  pending: []
  failed:
  - failed
  - rejected
docs: README.txt
messaging:
  supported: false
webhooks:
  supported: true
access_state: PARTIAL_NATIVE
publish_mode: direct
status_authority: best_effort
media_transfer: pull_from_url
review_requirement: none
account_types:
- user
- experience
sdk_min: 1.0.0
sdk_policy: backward_compatible
contract_strict: true
