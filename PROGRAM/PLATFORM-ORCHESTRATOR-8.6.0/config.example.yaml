# Пример конфигурации (значения-заглушки). Скопируйте в config.yaml и заполните.
# Живой config.yaml в репозиторий НЕ коммитится.
schedules:
  long_video:
    type: long_video
    source: videomaker
    days: [tue, fri]
    time: "16:00"
    exception_days: []
  shorts_thematic:
    type: shorts_thematic
    source: videomaker
    default_time: "20:30"
  shorts_standalone:
    type: shorts_standalone
    source: shortsmaker
    days: [mon, wed, thu, sat, sun]
    times: ["12:00", "18:00"]
    exception_days: []

# Rollout: telegram first → youtube → rest
# account_id / channel_id: заполнить после OAuth connect (platform_accounts)
platforms:
  telegram:
    post_mode: link            # в Telegram — только ссылка на YouTube (лимит 50 МБ)
    send_via: bot              # отправляем сами через Bot API: превью ролика НАД текстом
    publish_chat_id: ""   # канал «Точка наблюдения» (@tochkanablyudeniya)
    link_preview_above: true   # Bot API link_preview_options.show_above_text
    video_variant: vertical
    audio_profile: default   # reserved (не используется)
    enabled: true
    daily_limit: 5
    account_id: ""             # OAuth / platform_accounts id
    channel_id: ""             # optional TG chat id
  youtube:
    video_variant: wide
    audio_profile: youtube_safe   # reserved
    enabled: true
    daily_limit: 7
    account_id: ""             # OAuth / platform_accounts id
    channel_id: ""             # optional YT channel id
  instagram:
    video_variant: vertical
    audio_profile: meta_safe   # reserved
    enabled: false
    daily_limit: 5
    account_id: ""
    channel_id: ""
    graph_version: "v26.0"
  tiktok:
    video_variant: vertical
    audio_profile: tiktok_safe   # reserved
    enabled: false
    daily_limit: 7
    account_id: ""
    channel_id: ""
  facebook:
    video_variant: wide
    audio_profile: meta_safe   # reserved
    enabled: false
    daily_limit: 5
    account_id: ""
    channel_id: ""
    graph_version: "v26.0"
  threads:
    video_variant: vertical
    audio_profile: default
    enabled: false
    daily_limit: 3
    account_id: ""
    channel_id: ""
  vk:
    enabled: false
    daily_limit: 15
    min_interval_sec: 120
    group_id: ""
    account_id: ""
    modes: ["video", "promo", "link"]
    content_kind_default: video_native
    video_variant: wide
  x:
    enabled: false
    daily_limit: 10
    min_interval_sec: 60
    account_id: ""
    content_kind_default: promo_text
    max_chars: 280
  rutube:
    enabled: false
    daily_limit: 5
    account_id: ""
    content_kind_default: video_native


tail:
  soft_enter_days: 5
  series_end_question_ttl_days: 10
  series_end_question_cooldown_days: 3
  use_all_short_slots: true
  pause_standalone_during_tail: true
  ask_minutes_before: 60        # спросить за час до слота серии (16:00 -> 15:00)
  reminder_minutes_before: 15   # напомнить за 15 минут до слота
  default_action: distribute    # distribute | wait (если не ответили к слоту)

limits:
  max_posts_per_distribute: 12
  module_create_per_hour: 60   # module-path create rate limit
  max_shorts_per_long_video: 8
  overflow_move_files: false   # НЕ переносить файлы; лишнее просто не публикуется

link_update:
  release_url_timeout_min: 90
  missing_url_dialog_ttl_hours: 12
  missing_url_default_action: "post_without_link"
  placeholder_text: "Полное видео на канале"

description_templates:
  x_promo: "{title}\n{description_short}\n{link}\n{hashtags}"
  vk_promo: "{title}\n\n{description}\n\n{link}"
  telegram_link: "{title}\n\n{description}\n\n▶ Смотреть на YouTube: {link}"
  telegram_link_no_link: "{title}\n\n{description}\n\n▶ Смотреть на YouTube — ссылка появится после премьеры"
  thematic_short: "{description}\n\n▶ Полное видео: {link}"
  thematic_short_no_link: "{description}\n\n▶ Полное видео на канале"
  default: "{description}"

safety:
  min_interval_minutes: 25
  conflict_window_minutes: 0   # окно анти-коллизий с внешними планировщиками (0 = как min_interval)
  jitter_seconds: 0   # без случайного сдвига — стандартные времена 16:00/20:30
  warmup_days: 12
  warmup_daily_limit: 2
  warmup_after_pause_hours: 24
  on_serious_error:
    action: pause_platform
    pause_hours: 0
    notify: true
  serious_errors:
    - "rate limit"
    - "quota exceeded"
    - "spam"
    - "blocked"
    - "Unsupported file type"
  rate_limit_errors: ["429", "too many requests", "ThrottlerException"]
  auth_errors:
    - "No API Key found"
    - "Invalid API key"
    - "unauthorized"
    - "401"
    - "403"
    - "invalid token"
    - "token expired"
    - "authentication"

telegram:
  # 2026-09-23: убран второй id (группа/канал) — бот в этом чате отсутствует
  # (getChat → 400 chat not found), из-за него при каждой синхронизации меню-кнопки
  # летела ошибка invalid chat_id. Возвращать — только вместе с доступом бота к чату.
  allowed_chat_ids: []

# Проекты (ниши): у каждого проекта свои каналы во всех сетях. Пока проект один —
# «Точка наблюдения», поэтому у платформ project не указан ("" = основной проект).
# Второй проект добавляется так: завести блок ниже + платформы с project: <имя>
# (например telegram_anekdoty, youtube_anekdoty). Подробности: docs/PLAN-PROJECTS.md
default_project: "tochka"    # контент без явной привязки относится к «Точке наблюдения»

projects:
  tochka:
    title: "Точка наблюдения"
    series_ids: []          # id серий videomaker проекта (пусто = контент не привязан)
    folders: []             # папки обычных шортсов проекта
    telegram_chat_ids: []
  project2:                 # второй проект: название владелец ещё не выбрал
    title: "Проект 2"
    series_ids: []
    folders: []
    telegram_chat_ids: []

media:
  symlink_mode: true            # symlink local files instead of full copy into cache
  local_prefix: "/mnt/video/"   # что считается «на диске сервера»
  cache_dir: "/mnt/video/.orch_cache"
  telegram_max_mb: 0            # сжатие выключено (0)

backup:
  enabled: true
  interval_hours: 6
  keep_days: 14
  method: "sqlite_backup"   # код всегда использует Connection.backup (VACUUM INTO — неверный ярлык)

reconciliation_interval_hours: 24
claims:
  enabled: true
  hours_before: 6

daily_ahead:
  enabled: false
  hour: 9
  minute: 0
  days: 2
  dry_run: true
engines:
  youtube: module:youtube
  telegram: module:telegram
  instagram: module:instagram
  facebook: module:facebook
  threads: module:threads
  tiktok: module:tiktok
  vk: module:vk
  x: module:x
  rutube: module:rutube
manual_uploads:
  enabled: true
  platforms: []
  lookback_days: 60
  page_size: 50
  schedule_scan: daily
  placement_default: end   # default when entity.placement empty; UI can override per item
telegram_link_delay_min: 15   # Telegram-ссылка через N минут после выхода видео на YouTube
timezone: "Europe/Moscow"
watcher_interval_sec: 75
status_sync_interval_sec: 180
confirm_published_interval_sec: 120
file_stability_cycles: 2
watch_max_depth: 5   # глубина рекурсивного сканирования папок
watch_max_age_days: 3650  # не отсекать старое (скан должен возвращать удалённое)

# Пробный (тестовый) пост: отдельный контур, НЕ трогает боевые строки расписания.
# Включать только когда нужно проверить E2E-публикацию на тестовом канале.
test_publish:
  enabled: true                 # API/UI тестового поста доступны
  default_delay_minutes: 1
  min_delay_minutes: 1
  max_delay_minutes: 120
  title_prefix: "[orch-test] "
  platforms: ["youtube", "telegram"]   # allowlist (у нас это тестовые каналы)
  require_explicit_platforms: true
  allow_prod_channel: false
  prod_account_ids: []           # account_id боевых каналов (fail-closed)
  # fail-closed: тест разрешён только для этих account_id (OAuth / platform_accounts)
  test_account_ids: []
  skip_tail_side_effects: true
  skip_thematic_cascade: true
  zero_jitter: true

# CPU low profile (CPU-01/02): watcher_interval_sec: 150, status_sync_interval_sec: 300
# systemd drop-in example: deploy/orchestrator-cpu.conf (Nice=10 CPUQuota=50% MemoryMax=1G)
