  strategy: protocol_social
provider_type: social
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: false
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: false
  image: true
  text: true
  stories: false
  clips: false
