id: devto
name: Dev.to
api_version: v1
module_version: 0.2.0
core_min: 8.6.0
auth:
  method: api_key
  strategy: cms
  env: DEVTO_API_KEY
provider_type: publishing
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: true
  delete: false
  thumbnail: false
  claims_check: unsupported
  video: false
  image: false
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: true
  list_scheduled: false
  list_private: true
  scan_mode: auto
  schedule_owner: orchestrator
  content_kinds: [text, article]
  content_kind_default: article
limits:
  source: official
  source_url: https://developers.forem.com/api/v1
media:
  source: pull_from_url
statuses:
  published: [published]
  pending: [draft]
docs: MODULE_DEVTO.txt
messaging:
  supported: false
webhooks:
  supported: false
access_state: CODE_READY
publish_mode: direct
status_authority: authoritative
media_transfer: pull_from_url
review_requirement: none
account_types: [member, organization]
contract_strict: true
