id: hashnode
name: Hashnode
api_version: graphql
module_version: 0.2.0
core_min: 8.6.0
auth:
  method: pat
  strategy: api_token
  broker_key: hashnode
provider_type: publishing
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: true
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: false
  image: true
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: false
  list_scheduled: false
  list_private: false
  scan_mode: unsupported
  schedule_owner: orchestrator
  content_kinds:
  - article
  content_kind_default: article
limits:
  source: provider
  tags_max: 15
media:
  image:
    upload: supported_by_provider
statuses:
  published:
  - published
  pending: []
  failed:
  - failed
  deleted:
  - removed
messaging:
  supported: false
webhooks:
  supported: true
  code_ready: false
access_state: CODE_READY
publish_mode: direct
status_authority: authoritative
media_transfer: mixed
review_requirement: none
account_types:
- publication
docs: MODULE_HASHNODE.txt
contract_strict: true
