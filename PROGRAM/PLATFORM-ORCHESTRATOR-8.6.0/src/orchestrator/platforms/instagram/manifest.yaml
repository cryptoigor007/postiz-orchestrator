id: instagram
name: Instagram
api_version: '1'
module_version: 0.3.0
core_min: 8.0.0
auth:
  method: oauth
  strategy: meta_ig
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: false
  delete: false
  thumbnail: false
  claims_check: unsupported
  video: true
  image: true
  text: false
  stories: false
  list_uploads: true
  list_scheduled: false
  list_private: false
  scan_mode: published_only
  schedule_owner: orchestrator
limits:
  daily_default: 5
media:
  max_mb: 300
statuses:
  published: published
provider_type: social
publish_mode: orchestrator
status_authority: authoritative
media_transfer: mixed
review_requirement: app_review
account_types:
- professional_business
- professional_creator
docs: MODULE_INSTAGRAM.txt
messaging:
  supported: false
webhooks:
  supported: false

contract_strict: true
