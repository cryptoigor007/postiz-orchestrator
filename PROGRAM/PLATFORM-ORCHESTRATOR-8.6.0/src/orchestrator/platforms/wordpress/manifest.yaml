id: wordpress
name: WordPress
api_version: v2
module_version: 0.2.0
core_min: 8.6.0
auth:
  method: application_password
  strategy: cms
  env: WORDPRESS_APP_PASSWORD
provider_type: publishing
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: true
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: false
  image: false
  text: true
  stories: false
  clips: false
  public_media_required: false
  list_uploads: true
  list_scheduled: false
  list_private: true
  scan_mode: auto
  schedule_owner: orchestrator
  content_kinds: [text, article]
  content_kind_default: article
limits:
  source: official
  source_url: https://developer.wordpress.org/rest-api/reference/posts/
media:
  source: not_required_for_text
statuses:
  published: [publish]
  pending: [draft, future, pending, private]
docs: MODULE_WORDPRESS.txt
messaging:
  supported: false
webhooks:
  supported: false
access_state: CODE_READY
publish_mode: direct
status_authority: authoritative
media_transfer: pull_from_url
review_requirement: none
account_types: [site]
contract_strict: true
