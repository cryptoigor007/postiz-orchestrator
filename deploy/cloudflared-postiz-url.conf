[Service]
# Публичный адрес quick-туннеля меняется при каждом перезапуске службы. После старта пишем его
# в /var/lib/cloudflared-postiz.url — это заметка для человека (scripts/postiz_tunnel_sync.sh
# предпочитает свежий адрес из journalctl). Цикл ждёт появления ссылки в журнале (до 20 с) и всегда
# завершается успешно, чтобы не уронить юнит. ВАЖНО: в дроп-ине только эта строка — ExecStart=
# здесь повторять нельзя (список: systemd добавил бы второй ExecStart и отказался стартовать юнит).
# Вступает в силу только при следующем естественном запуске: перезапускать cloudflared-postiz
# нельзя — адрес сменится, а он уже вписан в Meta/TikTok и в FRONTEND_URL контейнеров.
ExecStartPost=/bin/bash -c 'for i in {1..20}; do u=$(/usr/bin/journalctl -u cloudflared-postiz --no-pager -n 50 2>/dev/null | grep -oE "https://[a-z0-9-]+[.]trycloudflare[.]com" | tail -1); if [ -n "$u" ]; then echo "$u" > /var/lib/cloudflared-postiz.url; exit 0; fi; sleep 1; done; exit 0'
