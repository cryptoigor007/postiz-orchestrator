id: postiz
name: Postiz Adapter
api_version: "Postiz public/v1"
module_version: "1.0.0"
core_min: "8.5.0"
auth:
  method: api_token
  scopes: []
  broker_key: ""
capabilities:
  publish: true
  early_upload: false
  schedule_publish: true
  update_metadata: false
  delete: true
  thumbnail: false
  claims_check: unsupported
  video: true
  image: true
  text: true
  stories: false
  public_media_required: false
limits:
  posts_per_day: 0
  rate:
    rpm: 30
  quota:
    unit: "posts"
    per_day: 0
media:
  video:
    container: mp4
    max_mb: 256000
  image:
    formats: [jpg, png]
    max_mb: 50
  text:
    max_chars: 5000
statuses:
  published: [published, done, completed]
  pending: [queue, scheduled, processing, pending]
  failed: [error, failed]
docs: MODULE_POSTIZ (adapter; see engines/postiz_engine.py)
