id: tiktok
name: Tiktok
api_version: "Content Posting API v2"
module_version: "0.2.0"
core_min: "8.5.0"
auth:
  method: oauth2_authorization_code
  scopes: []
  broker_key: tiktok
capabilities:
  publish: true
  early_upload: false
  schedule_publish: false
  update_metadata: false
  delete: false
  thumbnail: false
  claims_check: unsupported
  video: true
  image: false
  text: false
  stories: false
  public_media_required: false
limits:
  posts_per_day: 0
  rate:
    rpm: 10
media:
  video:
    max_mb: 1000
  image:
    formats: [jpg, png]
    max_mb: 8
statuses:
  published: [published]
  pending: [processing]
  failed: [error]
docs: MODULE_TIKTOK.txt
