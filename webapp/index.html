<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Orchestrator</title>
  <!-- F10: без иконки браузер каждый раз просит /favicon.ico и получает 404 -->
  <link rel="icon" href="data:," />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=820" />
</head>
<body>
  <div id="gate" class="auth-gate" hidden>
    <div>
      <h2>Orchestrator</h2>
      <p id="gate-msg">Open the app from the Telegram bot.</p>
    </div>
  </div>

  <div id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">O</div>
        <div>
          <h1>Orchestrator</h1>
          <span id="ver">v—</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="status" class="active"><span class="ico" aria-hidden="true"><svg viewBox="0.88 0.88 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span><span class="label">Обзор</span></button>
        <button data-view="folders"><span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="label">Видео</span></button>
        <button data-view="manual"><span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg></span><span class="label">Ручные</span></button>
        <button data-view="calendar"><span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span><span class="label">Календарь</span></button>
        <button data-view="queue"><span class="ico" aria-hidden="true"><svg viewBox="0.88 0.88 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="label">Очередь</span></button>
        <button data-view="platforms"><span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="label">Сети</span></button>
        <button data-view="tail"><span class="ico" aria-hidden="true"><svg viewBox="0.88 0.38 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l6-6 4 4 6-7"/><path d="M15 7h5v5"/></svg></span><span class="label">Остаток</span></button>
        <button data-view="metrics"><span class="ico" aria-hidden="true"><svg viewBox="0.88 0.88 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span class="label">Стат.</span></button>
        <button data-view="actions"><span class="ico" aria-hidden="true"><svg viewBox="-0.88 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h7l-1 7 9-11h-7z"/></svg></span><span class="label">Действия</span></button>
        <button data-view="settings"><span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.3"/><circle cx="12" cy="12" r="3.6"/><path d="M12 5.7V3.4M18.3 12h2.3M12 18.3v2.3M5.7 12H3.4M16.45 7.55l1.63-1.63M16.45 16.45l1.63 1.63M7.55 16.45l-1.63 1.63M7.55 7.55l-1.63-1.63" stroke-width="2.6"/></svg></span><span class="label">Настройки</span></button>
      </nav>
      <div class="sidebar-footer">
        <div id="user-info">Telegram WebApp</div>
        <div class="lang" id="lang">
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-center">
          <h2 id="title">Статус</h2>
          <button class="icon-ghost" id="btn-refresh" aria-label="Обновить" title="Обновить">
            <span class="ico" aria-hidden="true"><svg viewBox="0.69 -0.26 22.63 22.63" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></span>
          </button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Нижняя навигация (mobile): 4 основных + «Ещё» -->
  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <button data-view="status" class="active">
      <span class="ico" aria-hidden="true"><svg viewBox="0.88 0.88 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">Обзор</span></button>
    <button data-view="folders">
      <span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
      <span class="label">Видео</span></button>
    <button data-view="queue">
      <span class="ico" aria-hidden="true"><svg viewBox="0.88 0.88 22.25 22.25" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
      <span class="label">Очередь</span></button>
    <button data-view="calendar">
      <span class="ico" aria-hidden="true"><svg viewBox="-0.38 -0.38 24.75 24.75" fill="none" stroke="currentColor" stroke-width="1.86" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
      <span class="label">Календарь</span></button>
    <button data-more="1" id="tab-more">
      <span class="ico" aria-hidden="true"><svg viewBox="1.75 1.75 20.5 20.5" fill="none" stroke="currentColor" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">Ещё</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=820"></script>
</body>
</html>
